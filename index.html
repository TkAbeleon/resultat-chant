<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>Résultats — Concours de chant</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="shortcut icon" href="./favicon.svg">
<meta name="description" content="Découvrez les résultats du concours de chant avec une expérience immersive de révélation et les notes détaillées.">
<meta name="robots" content="index,follow">
<meta property="og:type" content="website">
<meta property="og:locale" content="fr_FR">
<meta property="og:url" content="https://tkabeleon.github.io/resultat-chant/">
<meta property="og:site_name" content="Concours de chant">
<meta property="og:title" content="Résultats — Concours de chant">
<meta property="og:description" content="Découvrez les résultats du concours de chant avec une expérience immersive de révélation et les notes détaillées.">
<meta property="og:image" content="https://tkabeleon.github.io/resultat-chant/social-preview.png">
<meta property="og:image:secure_url" content="https://tkabeleon.github.io/resultat-chant/social-preview.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Concours de chant — Révélation des résultats">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Résultats — Concours de chant">
<meta name="twitter:description" content="Découvrez les résultats du concours de chant avec une expérience immersive de révélation et les notes détaillées.">
<meta name="twitter:image" content="https://tkabeleon.github.io/resultat-chant/social-preview.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <section id="reveal-scene" class="reveal-scene" aria-label="Révélation des résultats">
    <div class="atmosphere atmosphere-a"></div>
    <div class="atmosphere atmosphere-b"></div>
    <div class="spotlight"></div>
    <div id="dust" class="dust" aria-hidden="true"></div>
    <div class="ring ring-a" aria-hidden="true"></div>
    <div class="ring ring-b" aria-hidden="true"></div>
    <div class="floor-grid" aria-hidden="true"></div>

    <div id="scene-camera" class="scene-camera">
      <div id="stage" class="stage">
        <article id="reveal-card" class="reveal-card" aria-live="polite">
          <div class="card-depth depth-1"></div>
          <div class="card-depth depth-2"></div>
          <div class="card-face">
            <div class="card-glow"></div>
            <div class="card-noise"></div>
            <div class="card-content">
              <div class="rank-lockup">
                <span id="scene-rank">—</span>
              </div>

              <h2 id="scene-name">—</h2>

              <div class="scene-score-wrap">
                <div id="scene-total" class="scene-total">—</div>
              </div>

              <div id="scene-scores" class="score-list"></div>
            </div>
          </div>
        </article>
      </div>
    </div>

    <button id="sound-unlock" class="sound-unlock" type="button" aria-label="Activer le son" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M4 9v6h4l5 4V5L8 9H4zm11.2 1.05a4 4 0 0 1 0 3.9m2.15-6.05a7 7 0 0 1 0 8.2"/>
      </svg>
    </button>
    <audio id="suspense-audio" src="https://peritune.com/music/PerituneMaterial_Desert.mp3" preload="auto" autoplay></audio>
  </section>

  <section id="completion" class="results-shell" hidden>
    <header class="results-header">
      <div>
        <span class="eyebrow">Résultats officiels</span>
        <h1 id="completed-title">Résultats</h1>
        <p id="meta" class="meta"></p>
      </div>
      <button id="btnFull" class="ghost" type="button" aria-label="Plein écran">⛶</button>
    </header>

    <div id="stats" class="stats"></div>

    <div class="toolbar" aria-label="Outils de recherche et de filtrage">
      <input id="q" type="search" placeholder="Rechercher un nom" aria-label="Rechercher un nom">
      <select id="filter" aria-label="Filtrer les résultats">
        <option value="all">Tous</option>
        <option value="ret">Retenus</option>
      </select>
    </div>

    <main>
      <div id="grid" class="grid" aria-live="polite"></div>
      <p id="empty" class="empty" hidden></p>
    </main>
  </section>

  <p id="loading" class="loading">Chargement des résultats…</p>
</div>

<script src="app.js"></script>
</body>
</html>
