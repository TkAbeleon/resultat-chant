<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>Résultats — Concours de chant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <section id="reveal-scene" class="reveal-scene" aria-label="Révélation des résultats">
    <div class="atmosphere atmosphere-a"></div>
    <div class="atmosphere atmosphere-b"></div>
    <div class="spotlight"></div>
    <div id="dust" class="dust" aria-hidden="true"></div>
    <div class="ring ring-a" aria-hidden="true"></div>
    <div class="ring ring-b" aria-hidden="true"></div>
    <div class="floor-grid" aria-hidden="true"></div>

    <div class="scene-header">
      <div>
        <span class="eyebrow">Résultats officiels</span>
        <h1 id="title">Concours de chant</h1>
        <p id="scene-phase">Préparation de la révélation…</p>
      </div>
    </div>

    <div id="scene-camera" class="scene-camera">
      <div id="stage" class="stage">
        <article id="reveal-card" class="reveal-card" aria-live="polite">
          <div class="card-depth depth-1"></div>
          <div class="card-depth depth-2"></div>
          <div class="card-face">
            <div class="card-glow"></div>
            <div class="card-noise"></div>
            <div class="card-content">
              <div class="card-topline">
                <span id="scene-kicker">CANDIDAT RETENU</span>
                <span id="scene-index">— / —</span>
              </div>

              <div class="rank-lockup">
                <span id="scene-rank">—</span>
              </div>

              <h2 id="scene-name">—</h2>
              <span id="scene-status" class="scene-status">—</span>

              <div class="scene-score-wrap">
                <div id="scene-total" class="scene-total">—</div>
                <div class="scene-score-label">NOTE TOTALE</div>
              </div>

              <div id="scene-scores" class="score-list"></div>
            </div>
          </div>
        </article>
      </div>
    </div>

    <div class="scene-footer">
      <span id="sound-note">Préparation de l’ambiance…</span>
      <span>Révélation automatique</span>
    </div>
  </section>

  <section id="completion" class="results-shell" hidden>
    <header class="results-header">
      <div>
        <span class="eyebrow">Résultats officiels</span>
        <h1 id="completed-title">Résultats</h1>
        <p id="meta" class="meta"></p>
      </div>
      <button id="btnFull" class="ghost" type="button" aria-label="Plein écran">⛶</button>
    </header>

    <div id="stats" class="stats"></div>

    <div class="toolbar" aria-label="Outils de recherche et de filtrage">
      <input id="q" type="search" placeholder="Rechercher un nom" aria-label="Rechercher un nom">
      <select id="filter" aria-label="Filtrer les résultats">
        <option value="all">Tous</option>
        <option value="ret">Retenus</option>
      </select>
    </div>

    <main>
      <div id="grid" class="grid" aria-live="polite"></div>
      <p id="empty" class="empty" hidden></p>
    </main>
  </section>

  <p id="loading" class="loading">Chargement des résultats…</p>
</div>

<script src="app.js"></script>
</body>
</html>
